<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custeamento semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fixa · lista de obras à esquerda, editor por separadores à direita · parâmetros num ecrã próprio */
:root{
  --bg:#EEF0EC; --panel:#FFFFFF; --sunk:#F6F7F4; --ink:#17201C; --muted:#5A6560; --line:#D6DBD5; --line2:#E6E9E4;
  --accent:#1E5A4B; --accent-ink:#FFFFFF; --accent-soft:#DDEBE5;
  --warn:#8A5200; --warn-soft:#FAEBD0; --bad:#A12E1D; --bad-soft:#F7DFD9; --good:#2A6E36; --good-soft:#DDEFDF;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --panel:#182019; --sunk:#141A17; --ink:#E4E9E5; --muted:#98A49E; --line:#2B3530; --line2:#222B27;
  --accent:#6BB8A1; --accent-ink:#0B1411; --accent-soft:#1D2F29;
  --warn:#E3A84E; --warn-soft:#2E2414; --bad:#EE826F; --bad-soft:#341B17; --good:#79C487; --good-soft:#18291B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --panel:#182019; --sunk:#141A17; --ink:#E4E9E5; --muted:#98A49E; --line:#2B3530; --line2:#222B27;
  --accent:#6BB8A1; --accent-ink:#0B1411; --accent-soft:#1D2F29;
  --warn:#E3A84E; --warn-soft:#2E2414; --bad:#EE826F; --bad-soft:#341B17; --good:#79C487; --good-soft:#18291B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:26px;height:26px;border-radius:4px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:5px;background:var(--accent-ink);border-radius:1px;box-shadow:0 -8px 0 -1px var(--accent-ink)}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:8px;border:1px solid var(--line2)}
.nav button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.logo{display:block;width:150px;height:27px;background:var(--ink);-webkit-mask:var(--logo) no-repeat right center/contain;mask:var(--logo) no-repeat right center/contain;flex:none}
@media (max-width:520px){.logo{width:110px;height:20px}}
.manual .mlogo{display:block;width:170px;max-width:40vw;margin:0 0 10px auto}
.manual .mfoot{margin-top:26px;padding-top:8px;border-top:1px solid var(--m-line);display:flex;gap:28px;flex-wrap:wrap;font-size:10.5px;color:var(--m-muted);line-height:1.5}
#saveState{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
#saveState.err{color:var(--bad)}
main{padding-block:18px 60px;padding-inline:16px;max-width:1440px;margin:0 auto}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.side{position:static}}
.side .tools{display:flex;gap:8px}
.side .tools select{flex:1;min-width:0}
.olist{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 190px);overflow:auto;padding-right:2px}
@media (max-width:900px){.olist{max-height:none}}
.oitem{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.oitem:hover{border-color:var(--line)}
.oitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.oitem .n{font-weight:600;display:block}
.oitem .m{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:3px}
.oitem .p{font-family:var(--mono);font-size:12px;color:var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.Orçamento{background:var(--sunk)} .chip.Adjudicada{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.Em.curso,.chip.curso{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.Concluída{background:var(--good-soft);color:var(--good);border-color:transparent} .chip.Perdida{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.ico{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.ico:hover{color:var(--bad);background:var(--bad-soft)}
.ed-head{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ed-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.exp-b{display:flex;gap:6px}
.ed-title input{font-family:var(--display);font-weight:700;font-size:21px;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-6px;border-radius:4px;flex:1;min-width:200px}
.ed-title input:hover,.ed-title input:focus{border-color:var(--line);background:var(--sunk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:var(--r);padding:8px 10px}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--accent-soft)} .kpi.hl b{color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:4px}
.alert{font-size:13px;padding:5px 10px;border-radius:4px;display:flex;gap:8px;align-items:baseline}
.alert::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.bad::before{background:var(--bad)}
.falta{color:var(--warn);font-weight:600}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.warn::before{background:var(--warn)}
.alert.ok{background:var(--good-soft);color:var(--good)} .alert.ok::before{background:var(--good)}
details.al summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:15px;font-weight:700}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:-8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid .w2{grid-column:span 2} .grid .wf{grid-column:1/-1}
@media (max-width:520px){.grid .w2{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:600}
.f>small{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--panel);outline:none}
textarea{resize:vertical;min-height:56px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;vertical-align:middle}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:6px}
table{border-collapse:collapse;width:100%}
table.ed th,table.ed td,table.calc th,table.calc td{padding:5px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.ed th,table.calc th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
table.ed td input,table.ed td select,table.ed td textarea{padding:4px 6px;background:transparent;border-color:transparent}
table.ed td input:hover,table.ed td select:hover,table.ed td textarea:hover{border-color:var(--line)}
table.ed td input:focus,table.ed td select:focus,table.ed td textarea:focus{border-color:var(--accent);background:var(--panel)}
table.ed td.x{width:30px;text-align:center}
table.ed tr:last-child td{border-bottom:0}
table.ed .ro{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--muted)}
.num,td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.calc td.num input{text-align:right;width:110px;padding:4px 6px}
table.calc tr.grp td{background:var(--sunk);font-weight:700;font-family:var(--display)}
table.calc tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.wk>div:not(.hrow):not(.grid){display:flex;flex-direction:column;gap:6px}
.wk summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:revert}
.wk .wk-s{margin-left:auto;font-size:12.5px;color:var(--muted)} .wk .wk-s b{color:var(--ink);font-family:var(--mono);font-weight:500}
.kpi small{display:block;margin-top:2px}
table.calc tr.big td{font-size:16px;color:var(--accent)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (max-width:520px){.bar{grid-template-columns:110px minmax(0,1fr) 76px}}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font-size:12.5px;cursor:pointer;background:var(--sunk)}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--bad)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.ptabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sig{background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;width:100%;max-width:520px;height:auto;aspect-ratio:520/170;cursor:crosshair}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.info div{background:var(--sunk);border-radius:5px;padding:6px 9px}
.info span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.info b{font-family:var(--mono);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.sheetwrap{background:var(--sunk);border-radius:8px;padding:16px;overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.oitem,.btn,.nav button{transition:border-color .12s,background .12s}}
/* Manual de obra: folha de papel, cores próprias (igual ao ficheiro exportado) */
.manual{--m-ink:#1A1F1D;--m-muted:#5B6460;--m-line:#C9CFCB;--m-acc:#1E5A4B;--m-soft:#EEF2EF;background:#fff;color:var(--m-ink);font-family:"Public Sans","Segoe UI",Arial,sans-serif;font-size:12.5px;line-height:1.45;max-width:820px;margin:0 auto;padding:36px 40px;box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.manual h1{font-family:"Archivo",Arial,sans-serif;font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
.manual h2{font-family:"Archivo",Arial,sans-serif;font-size:14.5px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--m-acc);color:var(--m-acc);break-after:avoid}
.manual .mh{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--m-line);padding-bottom:10px;margin-bottom:6px;flex-wrap:wrap}
.manual .mh small{color:var(--m-muted);display:block;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;font-weight:700}
.manual table{width:100%;border-collapse:collapse;margin:4px 0}
.manual th,.manual td{border:1px solid var(--m-line);padding:5px 7px;text-align:left;vertical-align:top}
.manual th{background:var(--m-soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.manual table.kv th{width:32%;text-transform:none;letter-spacing:0;font-size:12px}
.manual .box{display:inline-block;width:12px;height:12px;border:1.5px solid var(--m-ink);border-radius:2px;vertical-align:-2px;margin-right:6px;text-align:center;line-height:9px;font-size:11px}
.manual ul.cl{list-style:none;padding:0;margin:0;columns:2;column-gap:24px}
.manual ul.cl li{padding:3px 0;break-inside:avoid}
.manual .em{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.manual .em div{border:1.5px solid var(--m-acc);border-radius:4px;padding:6px 8px}
.manual .em b{display:block;font-size:17px;font-family:"IBM Plex Mono",monospace}
.manual .warn{background:#FBEAD0;color:#7A4700;padding:6px 9px;border-radius:4px;margin:6px 0}
.manual .note{color:var(--m-muted);font-size:11.5px}
.manual .sigbox{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.manual .sigbox div{flex:1;min-width:220px}
.manual .sigline{border-bottom:1px solid var(--m-ink);height:70px;display:flex;align-items:flex-end}
.manual .sigline img{max-height:68px}
.manual td.blank{height:26px}
@media (max-width:600px){.manual{padding:20px 16px}.manual ul.cl{columns:1}}
table.calc tr.sub td{color:var(--muted);font-size:12.5px;padding-top:3px;padding-bottom:3px}
table.calc tr.sub td:first-child{padding-left:22px}
/* ============ instruções ============ */
.aj{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.aj-menu{position:sticky;top:calc(var(--hdr,70px) + 6px);z-index:5;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px;max-height:calc(100vh - 100px);overflow:auto}
.aj-menu .t{font-family:var(--display);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px 8px}
.aj-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 8px;cursor:pointer;color:var(--ink);font-weight:500;font-size:13.5px;line-height:1.25}
.aj-menu button:hover{background:var(--sunk)}
.aj-menu button .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted);border:1px solid var(--line2)}
.aj-menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.aj-menu button[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.aj-doc{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:980px}
.aj-hero{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#0b2a22) 100%);color:var(--accent-ink);border-radius:12px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px}
.aj-hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.aj-hero p{margin:0;max-width:640px;opacity:.92;font-size:15px}
.aj-passos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:8px}
.aj-passos button{border:0;border-radius:9px;padding:12px 12px 11px;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:inherit;display:flex;flex-direction:column;gap:4px;transition:background .12s}
.aj-passos button:hover{background:color-mix(in srgb,var(--accent-ink) 24%,transparent)}
.aj-passos b{font-family:var(--display);font-size:22px;line-height:1}
.aj-passos span{font-size:12.5px;font-weight:600;line-height:1.25}
.aj-sec{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.aj-sec>header{display:flex;align-items:center;gap:12px}
.aj-sec>header .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:16px}
.aj-sec h3{font-size:20px;font-weight:800}
.aj-sec h4{font-size:15px;font-weight:700;margin-top:4px}
.aj-sec p{margin:0;max-width:72ch}
.aj-lead{font-size:15px;color:var(--muted)}
.aj-fig{margin:0;display:flex;flex-direction:column;gap:6px}
.aj-fig button{border:1px solid var(--line);border-radius:10px;padding:0;background:#fff;cursor:zoom-in;overflow:hidden;box-shadow:0 6px 18px -10px rgba(0,0,0,.35);display:block;max-width:100%}
.aj-fig img{display:block;width:100%;height:auto}
.aj-fig figcaption{font-size:12.5px;color:var(--muted)}
.aj-passo{list-style:none;counter-reset:p;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.aj-passo li{counter-increment:p;position:relative;padding-left:36px;min-height:26px;max-width:72ch}
.aj-passo li::before{content:counter(p);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.aj-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px}
.aj-leg li{display:flex;gap:10px;align-items:flex-start}
.aj-leg li i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;background:#E8590C;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
.aj-dica,.aj-atencao,.aj-ex{border-radius:9px;padding:12px 14px 12px 44px;position:relative;max-width:80ch}
.aj-dica{background:var(--good-soft);color:var(--ink)}
.aj-atencao{background:var(--warn-soft);color:var(--ink)}
.aj-ex{background:var(--sunk);border:1px dashed var(--line)}
.aj-dica::before,.aj-atencao::before,.aj-ex::before{position:absolute;left:13px;top:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.aj-dica::before{content:"✓";background:var(--good);color:var(--panel)}
.aj-atencao::before{content:"!";background:var(--warn);color:var(--panel)}
.aj-ex::before{content:"€";background:var(--ink);color:var(--panel)}
.aj-dica b,.aj-atencao b,.aj-ex b{display:block;margin-bottom:2px}
.aj-grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.aj-grelha>div{background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.aj-grelha b{font-size:13.5px}
.aj-grelha span{font-size:12.5px;color:var(--muted)}
.aj-faq details{border:1px solid var(--line2);border-radius:9px;background:var(--sunk)}
.aj-faq details+details{margin-top:8px}
.aj-faq summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.aj-faq summary::after{content:"+";color:var(--muted);font-weight:700}
.aj-faq details[open] summary::after{content:"–"}
.aj-faq details>div{padding:0 14px 12px;color:var(--ink);max-width:76ch}
.aj-zoom{position:fixed;inset:0;z-index:200;background:rgba(10,14,12,.82);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.aj-zoom img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
kbd.aj-b{font-family:var(--body);font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
@media (max-width:1100px){.aj-passos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
 .aj{grid-template-columns:minmax(0,1fr);gap:14px}
 .aj-menu{flex-direction:row;overflow-x:auto;max-height:none;padding:6px;gap:4px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
 .aj-menu .t{display:none}
 .aj-menu button{width:auto;white-space:nowrap;flex:none}
 .aj-sec{padding:18px 16px}
 .aj-hero{padding:20px 18px}
 .aj-passos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ============ início: painel de todas as obras ============ */
:root{--c-mo:#2a78d6;--c-desl:#eb6834;--c-ref:#1baf7a;--c-aloj:#eda100;--c-contr:#e87ba4;--c-outros:#008300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-mo:#3987e5;--c-desl:#d95926;--c-ref:#199e70;--c-aloj:#c98500;--c-contr:#d55181;--c-outros:#0ca30c}}
:root[data-theme="dark"]{--c-mo:#3987e5;--c-desl:#d95926;--c-ref:#199e70;--c-aloj:#c98500;--c-contr:#d55181;--c-outros:#0ca30c}
.ini{display:flex;flex-direction:column;gap:18px}
.ini-hero{position:relative;overflow:hidden;border-radius:14px;padding:28px 28px 24px;color:#fff;
 background:radial-gradient(120% 140% at 100% 0%,#3d8c74 0%,transparent 55%),linear-gradient(135deg,#1E5A4B 0%,#0c2b23 100%)}
.ini-hero::before{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
 background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);background-size:34px 34px;
 -webkit-mask-image:linear-gradient(105deg,transparent 30%,#000 85%);mask-image:linear-gradient(105deg,transparent 30%,#000 85%)}
.ini-hero>*{position:relative}
.ini-hero .d{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.ini-hero h2{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:6px}
.ini-hero p{margin:6px 0 0;max-width:640px;font-size:15px;opacity:.92}
.ini-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ini-acts button{border:0;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;background:rgb(255 255 255 / .14);color:inherit;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
.ini-acts button:hover{background:rgb(255 255 255 / .24)}
.ini-acts button.pri{background:#fff;color:#1E5A4B}
.ini-acts button.pri:hover{background:#e6f2ed}
.ini-acts small{font-weight:500;opacity:.8}
.ini-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ini-k{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ini-k span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ini-k b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini-k small{font-size:12px;color:var(--muted)}
.ini-k.hl{background:var(--accent-soft);border-color:transparent}.ini-k.hl b{color:var(--accent)}
.ini-k b.neg{color:var(--bad)}.ini-k b.pos{color:var(--good)}
.ini-row{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.ini-card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ini-card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ini-card h3{font-size:16px;font-weight:800}
.ini-card .sub{font-size:12.5px;color:var(--muted);margin:0}
/* evolução mensal: colunas empilhadas */
.mch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.mch-y{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;transform:translateY(-6px)}
.mch-p{position:relative;height:220px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line)}
.mch-g{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);pointer-events:none}
.mch-c{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default}
.mch-c .st{width:min(100%,46px);display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.mch-c .st i{display:block;border-top:2px solid var(--panel)}
.mch-c .st i:last-child{border-top:0}
.mch-c .t{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.mch-c:hover .st{filter:brightness(1.07)}
.mch-c.now .st{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--accent)}
.mch-x{grid-column:2;display:flex;gap:6px;margin-top:5px}
.mch-x span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.mch-x span b{display:block;font-weight:600;color:var(--ink);font-size:11px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.leg b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.ini-card details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
/* desvio por obra: barras divergentes */
.dv{display:flex;flex-direction:column;gap:9px}
.dv-r{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:left;cursor:pointer;padding:4px 6px;margin:0 -6px;border-radius:7px;color:inherit}
.dv-r:hover{background:var(--sunk)}
.dv-r .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-r .n small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.dv-t{position:relative;height:14px}
.dv-t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--line)}
.dv-t i{position:absolute;top:1px;height:12px;border-radius:3px}
.dv-t i.neg{left:50%;background:var(--bad);border-radius:0 3px 3px 0}
.dv-t i.pos{right:50%;background:var(--good);border-radius:3px 0 0 3px}
.dv-r .v{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dv-r .v.neg{color:var(--bad)}.dv-r .v.pos{color:var(--good)}
.dv-r .v small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.dv-ax{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;font-size:11px;color:var(--muted)}
.dv-ax span{display:flex;justify-content:space-between}
/* atenção */
.att{display:flex;flex-direction:column;gap:7px}
.att button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--sunk);border-radius:9px;padding:9px 11px;cursor:pointer;color:inherit}
.att button:hover{border-color:var(--line)}
.att span.ic{color:#fff;font-size:12px}
.att .ic{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;text-indent:0;font-weight:800;font-size:12px;color:var(--panel)}
.att .ic.bad{background:var(--bad)}.att .ic.warn{background:var(--warn)}.att .ic.info{background:var(--accent)}
.att b{display:block;font-size:13px}.att span{font-size:12.5px;color:var(--muted)}
.att-ok{background:var(--good-soft);border-radius:9px;padding:10px 12px;font-size:13px}
/* últimas semanas */
.ult{display:flex;flex-direction:column}
.ult button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line2);background:none;padding:8px 2px;text-align:left;cursor:pointer;color:inherit}
.ult button:last-child{border-bottom:0}
.ult button:hover{background:var(--sunk)}
.ult .dt{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 7px;text-align:center;min-width:52px;line-height:1.15}
.ult .dt b{display:block;font-size:15px;font-family:var(--display)}
.ult .o{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ult .o small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ult .c{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
/* tabela de obras */
.ini-f{display:flex;gap:8px;flex-wrap:wrap}
.ini-f select{width:auto;max-width:240px}
.ini-row.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
table.ot{width:100%;border-collapse:collapse;font-size:13px}
table.ot th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);text-align:left;padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--line2)}
table.ot td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
table.ot td.num,table.ot th.num{text-align:right;font-variant-numeric:tabular-nums}
table.ot tbody tr{cursor:pointer}
table.ot tbody tr:hover td{background:var(--sunk)}
table.ot td .nm{font-weight:700}table.ot td .nm small{display:block;font-weight:500;color:var(--muted)}
table.ot tfoot td{font-weight:700;background:var(--accent-soft);border-bottom:0}
.pbar{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.pbar i{width:54px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:block}
.pbar i em{display:block;height:100%;background:var(--accent);border-radius:3px}
.pbar i em.over{background:var(--bad)}
td.neg{color:var(--bad);font-weight:700}td.pos{color:var(--good);font-weight:700}
/* dica flutuante dos gráficos */
.vtip{position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:260px}
.vtip b{display:block;font-size:12.5px;margin-bottom:2px}
.vtip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.vtip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
@media (max-width:1180px){.ini-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.ini-row,.ini-row.eq{grid-template-columns:minmax(0,1fr)}.ini-hero{padding:22px 18px}.ini-hero h2{font-size:25px}.ini-card{padding:16px 14px}}
@media (max-width:560px){.ini-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ini-k b{font-size:20px}.mch-c .t{display:none}.mch-p,.mch-y{height:180px}}

/* topo no telemóvel: marca e logótipo na primeira linha, separadores por baixo */
@media (max-width:760px){.top .brand{order:0}.top .logo{order:1}#saveState{order:2;min-width:0}.top .nav{order:3;flex-basis:100%}}
</style>

</head>

/* automatismos: chefe de obra na equipa, viaturas e zona pelo país */
function autoRules(path){const O=S.obras[S.sel];if(!O||!path.startsWith('O.'))return;let ch=false;
 if(path==='O.chefeObraId'&&O.chefeObraId&&!(O.equipa||[]).some(e=>e.pessoaId===O.chefeObraId)){O.equipa.unshift({pessoaId:O.chefeObraId,funcaoObra:'Chefe de obra',modo:'Carrinha',veiculoId:''});ch=true}
 if(path==='O.chefeObraId')(O.equipa||[]).forEach(e=>{if(e.pessoaId===O.chefeObraId&&e.funcaoObra==='Montador'){e.funcaoObra='Chefe de obra';ch=true}});
 if(/^O\.(equipa|veiculos|chefeObraId)/.test(path))ch=autoViaturas(O)||ch;
 if(path==='O.pais'&&O.pais&&O.pais!=='PT'&&O.zona!=='Estrangeiro'){O.zona='Estrangeiro';ch=true}
 if(path==='O.pais'&&O.pais==='PT'&&O.zona==='Estrangeiro'){O.zona='Portugal';ch=true}
 if(ch)saveObra(O.id)}

function autoViaturas(O){let ch=false;const ids=(O.veiculos||[]).map(v=>v.veiculoId).filter(Boolean);
 (O.equipa||[]).forEach(e=>{if(e.modo==='Voo'&&e.veiculoId){e.veiculoId='';ch=true}});
 (O.equipa||[]).forEach(e=>{if(e.modo!=='Carrinha'||(e.veiculoId&&ids.includes(e.veiculoId))||!e.pessoaId)return;
  const livre=ids.find(id=>{const vp=veiculo(id);return vp&&(O.equipa.filter(x=>x.modo==='Carrinha'&&x.veiculoId===id).length<num(vp.lugares))});
  if(livre&&e.veiculoId!==livre){e.veiculoId=livre;ch=true}});
 return ch}
document.addEventListener('toggle',e=>{const d=e.target;if(d?.dataset?.w){S.openW=S.openW||{};S.openW[d.dataset.w]=d.open}},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el)}});

/* ============ campos ============ */
const fid=p=>'f_'+p.replace(/[^\w]/g,'_');
function inp(path,{t='text',ph='',rc=false,step='any',cls=''}={}){const v=getP(path);
 const tt=t==='n'||t==='nn'?'number':t;const val=v==null?'':v;
 return `<input id="${fid(path)}" class="${cls}" type="${tt}" ${tt==='number'?`step="${step}"`:''} data-b="${path}" ${t==='n'||t==='nn'?`data-t="${t}"`:''} ${rc?'data-rc="1"':''} value="${esc(val)}" placeholder="${esc(ph)}">`}
function area(path,{ph='',lines=false,rows=2}={}){const v=getP(path);const val=lines?(v||[]).join('\n'):(v??'');
 return `<textarea id="${fid(path)}" rows="${rows}" data-b="${path}" ${lines?'data-t="lines"':''} placeholder="${esc(ph)}">${esc(val)}</textarea>`}
function sel(path,opts,{blank=null}={}){const v=getP(path);
 const o=opts.map(x=>Array.isArray(x)?x:[x,x]);
 return `<select id="${fid(path)}" data-b="${path}">${blank!==null?`<option value="">${esc(blank)}</option>`:''}${o.map(([k,l])=>`<option value="${esc(k)}" ${String(v??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
function chk(path,label,{inv=false}={}){const v=!!getP(path);const c=inv?!v:v;
 return `<label class="chk"><input id="${fid(path)}" type="checkbox" data-b="${path}" ${inv?'data-inv="1"':''} ${c?'checked':''}> ${esc(label)}</label>`}
const F=(label,html,{cls='',hint=''}={})=>`<label class="f ${cls}"><span>${esc(label)}</span>${html}${hint?`<small>${hint}</small>`:''}</label>`;
function tbl(path,cols,{add='Adicionar linha',tpl,extra}={}){const rows=getP(path)||[];
 const head=cols.map(c=>`<th class="${c.num?'num':''}" ${c.w?`style="min-width:${c.w}"`:''}>${esc(c.l)}</th>`).join('');
 const body=rows.map((r,i)=>`<tr>${cols.map(c=>`<td class="${c.ro&&c.num?'num':''}">${cell(`${path}.${i}.${c.k}`,r,c,i)}</td>`).join('')}<td class="x"><button type="button" class="ico" data-a="delRow" data-p="${path}" data-i="${i}" title="Remover linha" aria-label="Remover linha">×</button></td></tr>`).join('');
 return `<div class="tw"><table class="ed"><thead><tr>${head}<th></th></tr></thead><tbody>${body||`<tr><td colspan="${cols.length+1}" class="muted small" style="padding:10px">Sem linhas.</td></tr>`}</tbody></table></div>
 <div class="hrow" style="justify-content:flex-start"><button type="button" class="btn sm" data-a="addRow" data-p="${path}" data-tpl="${tpl||path.split('.').pop()}">+ ${esc(add)}</button>${extra||''}</div>`}
function cell(p,r,c,i){
 if(c.ro)return `<span class="ro">${c.ro(r,i)}</span>`;
 switch(c.t){case 'n':return inp(p,{t:'n'});case 'nn':return inp(p,{t:'nn',ph:c.ph||''});
  case 'sel':return sel(p,typeof c.o==='function'?c.o(r):c.o,{blank:c.blank??null});
  case 'chk':return `<input id="${fid(p)}" type="checkbox" data-b="${p}" ${getP(p)?'checked':''} aria-label="${esc(c.l)}">`;
  case 'lines':return area(p,{lines:true,rows:2,ph:c.ph||''});
  case 'csv':{const v=getP(p)||[];return `<input id="${fid(p)}" data-b="${p}" data-t="csv" value="${esc(v.join(', '))}" placeholder="${esc(c.ph||'')}">`}
  case 'date':return inp(p,{t:'date'});
  case 'list':return `<input id="${fid(p)}" data-b="${p}" list="${c.list}" value="${esc(getP(p)??'')}" placeholder="${esc(c.ph||'')}">`;
  default:return inp(p,{ph:c.ph||''})}}

/* ============ cálculo ============ */
const pessoa=id=>(S.params.pessoas||[]).find(p=>p.id===id);
const empresa=id=>(S.params.empresas||[]).find(e=>e.id===id);
const veiculo=id=>(S.params.veiculos||[]).find(v=>v.id===id);
const gestor=id=>(S.params.gestores||[]).find(g=>g.id===id);
const gesOpts=cur=>{const L=(S.params.gestores||[]).filter(g=>g.nome).map(g=>[g.id,g.nome]).sort((a,b)=>a[1].localeCompare(b[1],'pt'));return cur&&!L.some(x=>x[0]===cur)?[[cur,'(gestor removido)'],...L]:L};
const gestorInfo=id=>{const g=gestor(id);return g?[g.numero&&'Nº\u00a0'+g.numero,g.email,g.telefone&&String(g.telefone).replace(/ /g,'\u00a0')].filter(Boolean).join(' · '):'Lista em Parâmetros › Gestores.'};
/* chefe de obra: quem tem a função "Chefe de obra" na Equipa prevista (obras antigas: campo chefeObraId) */
const eChefe=(O,pid)=>!!pid&&((O.equipa||[]).some(e=>e.pessoaId===pid&&e.funcaoObra==='Chefe de obra')||(!(O.equipa||[]).some(e=>e.funcaoObra==='Chefe de obra')&&O.chefeObraId===pid));
const paisOf=O=>(S.params.paises||[]).find(x=>x.codigo===O.pais)||{};
function vCustoKm(v){const g=S.params?.geral||{};const comb=num(v.consumo)/100*num(g.precoCombustivel),pn=num(v.pneusTrocaKm)?num(v.pneus)/num(v.pneusTrocaKm):0,man=num(v.manutAno)&&isNum(v.kmAno)&&num(v.kmAno)?num(v.manutAno)/num(v.kmAno):0,var_=comb+pn+man,renda=!num(v.rendaMes)?0:isNum(v.kmAno)&&num(v.kmAno)?num(v.rendaMes)*12/num(v.kmAno):null;return {comb,pn,man,var:var_,renda,tot:renda==null?null:var_+renda}}
const ckmTxt=(v,k)=>{const c=vCustoKm(v);if(k==='var')return eur2(c.var)+'/km';if(k==='sem')return num(v.rendaMes)?eur2(num(v.rendaMes)/30*7):'<span class="muted">—</span>';return c.tot==null?'<span class="muted" title="Preencha Km/ano para repartir a renda">—</span>':`<b>${eur2(c.tot)}/km</b>`};
function refreshCustoKm(){document.querySelectorAll('[data-ckm]').forEach(el=>{const [i,k]=el.dataset.ckm.split(':');const v=(S.params?.veiculos||[])[+i];if(v)el.innerHTML=ckmTxt(v,k)})}
/* €/h de uma pessoa: o valor próprio (se existir) com os mesmos rácios sábado/domingo/noite/extra da empresa */
function taxas(p,emp){const eh=num(emp.hora),f=k=>eh&&num(emp[k])?num(emp[k])/eh:1;const rh=isNum(p?.hora)?num(p.hora):eh;
 return{rh,rs:rh*f('sabado'),rd:rh*f('domingo'),rn:rh*f('noite'),rx:rh*f('extra')}}
const vNome=v=>v?[v.marca,v.modelo].filter(Boolean).join(' ')+(v.matricula?` · ${v.matricula}`:' · sem matrícula'):'(viatura removida)';

/* valores de referência da obra (horas, refeições, estadia, voo) e orçamento da empresa */
function calc(O){
 const P=S.params,g=P.geral||{},pais=paisOf(O),est=O.zona==='Estrangeiro';
 const D=diasCal(O.dataInicio,O.dataFim),semanas=D?Math.ceil(D/7):0;
 const dTrab=diasUteis(O.dataInicio,O.dataFim);
 const h=isNum(O.horasDia)?num(O.horasDia):(num(g.horasDia)||8);
 const hn=Math.min(h,num(O.horasNoturnasDia));
 const v=O.viagem||{},estadiaOn=O.estadia?.necessaria!==false;
 const k=num(v.regressoCadaSemanas);
 const nV=!D?0:estadiaOn?(k>0?Math.max(1,Math.ceil(semanas/k)):1):dTrab;
 const noites=!D||!estadiaOn?0:Math.max(0,(D-1)-(nV-1)*3+(v.vespera?nV:0));
 const ref=est?{pa:isNum(pais.pa)?num(pais.pa):num(P.refeicoes?.Estrangeiro?.pa),almoco:isNum(pais.almoco)?num(pais.almoco):num(P.refeicoes?.Estrangeiro?.almoco),jantar:isNum(pais.jantar)?num(pais.jantar):num(P.refeicoes?.Estrangeiro?.jantar)}:{...(P.refeicoes?.Portugal||{pa:0,almoco:0,jantar:0})};
 const estPN=isNum(O.estadia?.precoNoite)?num(O.estadia.precoNoite):(est&&isNum(pais.alojamento)?num(pais.alojamento):num(P.estadias?.[O.zona]));
 const voo=isNum(O.voo?.preco)?num(O.voo.preco):num(g.precoVooIdaVolta);
 const oi=O.orc?.inst||{},ot=O.orc?.transp||{};const orc={};let orcTot=0;
 RUB.forEach(([key])=>{const i=RUB_INST.includes(key)?num(oi[key]):0,t=RUB_TRANSP.includes(key)?num(ot[key]):0;orc[key]={inst:i,transp:t,tot:i+t};orcTot+=i+t});
 const orcInst=RUB_INST.reduce((s,x)=>s+orc[x].inst,0),orcTransp=RUB_TRANSP.reduce((s,x)=>s+orc[x].transp,0);
 const A=[];const al=(lvl,msg)=>A.push({lvl,msg});
 if(!O.dataInicio||!O.dataFim)al('warn','Defina as datas de início e fim.');else if(!D)al('bad','A data de fim é anterior à data de início.');
 if(!orcTot)al('warn','Introduza os valores do orçamento no separador Orçamento.');
 if(!(O.equipa||[]).length)al('warn','A equipa está vazia: as semanas novas não vêm pré-preenchidas.');
 (O.equipa||[]).forEach((e,i)=>{const p=pessoa(e.pessoaId);if(!p){if(e.pessoaId)al('bad',`Linha ${i+1} da equipa: a pessoa já não existe nos parâmetros.`);return}
  const emp=empresa(p.empresaId)||{};if(!taxas(p,emp).rh)al('warn',`${p.nome}: a empresa ${emp.nome||'(sem empresa)'} não tem preço/hora.`);});
 const vSem=[...new Set((O.ctrl?.semanas||[]).flatMap(w=>(w.viagens||[]).filter(t=>(t.meio||'Carrinha')==='Carrinha').map(t=>t.veiculoId)).filter(Boolean))];
 vSem.forEach(id=>{const x=veiculo(id);if(!x)al('bad','Há viagens com uma viatura que já não existe na frota.');else if(num(x.rendaMes)&&!num(x.kmAno))al('warn',`${vNome(x)}: tem renda mas não tem km/ano na Frota, por isso a renda não entra no €/km.`)});
 if((O.equipa||[]).some(e=>e.modo==='Carrinha')&&!num(v.kmIda))al('warn','Falta a distância de ida (km) para custear as viagens de carrinha.');
 (O.ctrl?.semanas||[]).forEach(w=>{const vs=w.viagens||[];if(vs.some(t=>t.meio==='Avião'&&num(t.pessoas)>0&&!isNum(t.valor)&&!isNum(t.bilhete)))al('warn',`Semana de ${fmtD(w.inicio)}: falta o valor da viagem de avião (escreva-o ou importe a fatura).`);if(g.pagarHorasViagem&&vs.some(t=>t.meio==='Avião'&&num(t.pessoas)>0&&!isNum(t.horas)))al('warn',`Semana de ${fmtD(w.inicio)}: faltam as horas porta a porta da viagem de avião.`);if(vs.some(t=>(t.meio||'Carrinha')==='Carrinha'&&!t.veiculoId))al('warn',`Semana de ${fmtD(w.inicio)}: há uma viagem de carrinha sem viatura escolhida.`)});
 (O.ctrl?.semanas||[]).forEach(w=>(w.pessoas||[]).forEach(x=>{if(x.pessoaId&&!pessoa(x.pessoaId))al('bad',`Semana de ${fmtD(w.inicio)}: uma pessoa já não existe nos parâmetros.`)}));
 return{D,dTrab,semanas,nV,noites,h,hn,ref,estPN,voo,orc,orcTot,orcInst,orcTransp,preco:num(O.precoVenda),temPreco:isNum(O.precoVenda)&&num(O.precoVenda)>0,alerts:A}}

/* total gasto na lista de obras */

/* saídas em direto (sem redesenhar formulários) */

 $('#nav-inicio')?.setAttribute('aria-current',S.view==='inicio');$('#nav-obras')?.setAttribute('aria-current',S.view==='obras');$('#nav-params')?.setAttribute('aria-current',S.view==='params');$('#nav-ajuda')?.setAttribute('aria-current',S.view==='ajuda');
 const app=$('#app');

 let h=S.store==='db'?'':`<div class="banner">Os dados ficam guardados só neste computador e neste navegador. Para os partilhar com a equipa, abra a plataforma publicada.</div>`;

 if(!S.params){h+=`<div class="empty"><h3>Ainda não há parâmetros</h3><p>Os parâmetros (empresas, tarifas, pessoas, frota, estadias e refeições) alimentam o cálculo do real de cada semana.</p><button class="btn pri" data-a="initParams">Criar parâmetros de base</button></div>`;app.innerHTML=h;return}
 h+=S.view==='params'?viewParams():S.view==='inicio'?viewInicio():viewObras();app.innerHTML=h;compactar(app);
 if(act){const el=document.getElementById(act);if(el&&el.focus){el.focus({preventScroll:true});try{if(el.setSelectionRange&&el.type==='text'){const l=el.value.length;el.setSelectionRange(l,l)}}catch{}}}
 window.scrollTo(0,y)}

function viewObras(){
 const list=Object.values(S.obras).filter(o=>!S.filtro||o.estado===S.filtro).sort((a,b)=>String(b.dataInicio||b.criadoEm).localeCompare(String(a.dataInicio||a.criadoEm)));
 if(S.sel&&!S.obras[S.sel])S.sel=null;if(!S.sel&&list[0])S.sel=list[0].id;
 const side=`<aside class="side"><div class="tools"><button class="btn pri" data-a="newObra">+ Nova obra</button><select id="filtro" aria-label="Filtrar por estado" onchange="S.filtro=this.value;render()"><option value="">Todos os estados</option>${ESTADOS.map(e=>`<option ${S.filtro===e?'selected':''}>${e}</option>`).join('')}</select></div>
 <div class="olist">${list.map(o=>{const C=calc(o);const K=calcCtrl(o,C);return `<button class="oitem" data-a="selObra" data-id="${o.id}" data-oitem="${o.id}" aria-current="${o.id===S.sel}"><span class="n">${esc(o.nome||'Sem nome')}</span><span class="m"><span>${esc(o.cliente||'—')}</span><span class="chip ${esc(o.estado)}">${esc(o.estado)}</span></span><span class="m"><span>${fmtD(o.dataInicio)} → ${fmtD(o.dataFim)}</span></span><span class="m"><span>Gasto</span><span class="p" title="Total gasto até agora (real) / orçamento">${oiGasto(C,K)}</span></span></button>`}).join('')||'<p class="muted small">Sem obras neste filtro.</p>'}</div></aside>`;
 const O=S.obras[S.sel];
 const main=O?editor(O):`<div class="empty"><h3>Ainda não há obras</h3><p>Crie a primeira obra, introduza o orçamento e registe as semanas.</p><button class="btn pri" data-a="newObra">+ Nova obra</button></div>`;
 return `<div class="layout">${side}<section style="min-width:0">${main}</section></div>`}

function alertsHTML(C){const a=C.alerts;if(!a.length)return `<div class="alert ok">Sem alertas: datas, orçamento, equipa e viagens estão coerentes.</div>`;

const sg=d=>(d>0?'+':'')+eur(d);
const devC=d=>Math.abs(d)<0.5?'num':'num '+(d>0.5?'neg':'pos');

 <div class="kpi"><span>Orçamento</span><b>${eur(C.orcTot)}</b></div>

 ${C.temPreco?`<div class="kpi"><span>Margem prevista</span><b class="${K.margemPrev<0?'neg':''}">${pct(K.margemPrevPct)}</b><small class="muted small">orçada ${pct((C.preco-C.orcTot)/C.preco)}</small></div>`:''}`}

function tabObra(O,C){const P=S.params;
 const paises=(P.paises||[]).map(p=>[p.codigo,`${p.nome} (${p.codigo})`]);
 const pesOpts=(P.pessoas||[]).filter(p=>p.ativo!==false).map(p=>[p.id,`${p.nome} · ${empresa(p.empresaId)?.nome||'—'}`]);
 const supl=(P.suplementos||[]).filter(s=>s.ativo);
 return `
 <div class="card"><h3>Identificação</h3><div class="grid">
  ${F('Cliente',inp('O.cliente',{rc:true}))}${F('Referência / nº do orçamento',inp('O.referencia'))}

/* ============ custo em horas por trabalhador ============ */
function calcPes(O,C,K,wid){const lin=K.linhas.filter(x=>!wid||x.w.id===wid);const by={};let hv=0,cv=0;
 lin.forEach(x=>{x.s.det.forEach(d=>{const t=by[d.pessoaId]||(by[d.pessoaId]={pessoaId:d.pessoaId,interno:d.interno,dias:0,fds:0,hN:0,hF:0,hx:0,cN:0,cF:0,cX:0,supl:0,rh:d.rh,sem:0});
  for(const k of ['dias','fds','hN','hF','hx','cN','cF','cX','supl'])t[k]+=num(d[k]);t.sem++});
  x.s.via.forEach(v=>{hv+=num(v.hv);cv+=num(v.mo)})});
 const rows=Object.values(by).map(t=>({...t,horas:t.hN+t.hF+t.hx,custoH:t.cN+t.cF+t.cX,total:t.cN+t.cF+t.cX+t.supl})).sort((a,b)=>b.total-a.total);
 const T=rows.reduce((s,t)=>{for(const k of ['dias','fds','hN','hF','hx','horas','cN','cF','cX','custoH','supl','total'])s[k]=(s[k]||0)+t[k];return s},{});
 return{rows,T,hv,cv,n:lin.length}}

 const h1=n=>fnum(n,1);
 return `<div class="card"><div class="hrow"><h3>Custo em horas por trabalhador</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><select aria-label="Semana" onchange="S.pesW=this.value;render()" style="max-width:300px">${opts}</select><button class="btn sm" data-a="csvPes" ${R.rows.length?'':'disabled'}>Exportar (CSV)</button></div></div>

 ${R.rows.length?`<div class="tw"><table class="calc"><thead><tr><th style="min-width:190px">Trabalhador</th><th class="num">Dias úteis</th><th class="num">Dias sáb/dom</th><th class="num">Horas normais</th><th class="num">Horas sáb/dom</th><th class="num">Horas extra</th><th class="num">Total horas</th><th class="num">€/h</th><th class="num">Custo normal</th><th class="num">Custo sáb/dom</th><th class="num">Custo extra</th><th class="num">Custo em horas</th><th class="num">Suplementos</th><th class="num">Total</th></tr></thead><tbody>
 ${R.rows.map(t=>{const p=pessoa(t.pessoaId);const e=empresa(p?.empresaId);return `<tr><td><b>${esc(p?.nome||'(pessoa removida)')}</b><div class="small muted">${esc(e?.nome||'—')}${t.interno?'':' · subcontratado'}${wid?'':` · ${t.sem} semana(s)`}</div></td><td class="num">${h1(t.dias)}</td><td class="num">${h1(t.fds)}</td><td class="num">${h1(t.hN)}</td><td class="num">${h1(t.hF)}</td><td class="num">${h1(t.hx)}</td><td class="num"><b>${h1(t.horas)}</b></td><td class="num">${eur2(t.rh)}</td><td class="num">${eur(t.cN)}</td><td class="num">${eur(t.cF)}</td><td class="num">${eur(t.cX)}</td><td class="num"><b>${eur(t.custoH)}</b></td><td class="num">${eur(t.supl)}</td><td class="num"><b>${eur(t.total)}</b></td></tr>`}).join('')}
 <tr class="tot"><td>Total (${R.rows.length} trabalhadores)</td><td class="num">${h1(T.dias)}</td><td class="num">${h1(T.fds)}</td><td class="num">${h1(T.hN)}</td><td class="num">${h1(T.hF)}</td><td class="num">${h1(T.hx)}</td><td class="num">${h1(T.horas)}</td><td></td><td class="num">${eur(T.cN)}</td><td class="num">${eur(T.cF)}</td><td class="num">${eur(T.cX)}</td><td class="num">${eur(T.custoH)}</td><td class="num">${eur(T.supl)}</td><td class="num">${eur(T.total)}</td></tr>
 ${R.cv?`<tr class="sub"><td>Horas de viagem (toda a equipa, ao €/h médio)</td><td></td><td></td><td></td><td></td><td></td><td class="num">${h1(R.hv)}</td><td></td><td></td><td></td><td></td><td class="num">${eur(R.cv)}</td><td></td><td class="num">${eur(R.cv)}</td></tr>
 <tr class="tot"><td>Mão de obra total</td><td></td><td></td><td></td><td></td><td></td><td class="num">${h1(T.horas+R.hv)}</td><td></td><td></td><td></td><td></td><td class="num">${eur(T.custoH+R.cv)}</td><td class="num">${eur(T.supl)}</td><td class="num">${eur(T.total+R.cv)}</td></tr>`:''}
 </tbody></table></div>`:`<p class="muted">Ainda não há semanas registadas${wid?' nesta seleção':''}.</p>`}</div>`}

function dlCSVPes(){const O=S.obras[S.sel];const C=calc(O);const K=calcCtrl(O,C);const wid=K.sem.some(w=>w.id===S.pesW)?S.pesW:'';const R=calcPes(O,C,K,wid);
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const n=v=>v==null?'':String(Math.round(v*100)/100).replace('.',',');
 const wl=wid?(()=>{const i=K.sem.findIndex(w=>w.id===wid);return `Semana ${i+1} · ${semAnoL(K.sem[i].inicio)} (${fmtD(K.sem[i].inicio)})`})():'Todas as semanas';
 const L=[[q('Obra'),q(O.nome)].join(';'),[q('Período'),q(wl)].join(';'),''];

/* ============ faturas (PDF): o Claude extrai alojamento e viagens ============ */
function loadScript(src){return new Promise((ok,ko)=>{if([...document.scripts].some(s=>s.src===src))return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)})}
async function pdfLer(file){const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 await loadScript(base+'pdf.min.js');const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
 const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;const linhas=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const rows=new Map();
  tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3)*3;if(!rows.has(y))rows.set(y,[]);rows.get(y).push([it.transform[4],it.str.trim()])});
  [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,its])=>linhas.push(its.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ')))}
 return{doc,texto:linhas.join('\n')}}
/* PDF digitalizado (sem texto): as primeiras páginas seguem como imagens */
async function pdfImagens(doc,max){const out=[];for(let i=1;i<=Math.min(doc.numPages,max);i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>cv.toBlob(r,'image/png')))}return out}
const FAT_CAT={aviao:'voos',comboio:'voos',autocarro:'voos',taxi:'voos',transfer:'voos',portagens:'port',estacionamento:'port',combustivel:'comb',aluguer_viatura:'alug',outro:'outros'};
function sampleErr(e){return {not_granted:'Sem autorização para usar o Claude nesta página.',rate_limited:'Demasiados pedidos seguidos. Tente daqui a um minuto.',cancelled:'Pedido cancelado.',invalid_json:'A resposta veio num formato inesperado. Tente outra vez.',images_unavailable:'Esta vista não permite enviar imagens ao Claude.'}[e?.code]||'Não foi possível ler a fatura. Tente outra vez.'}

async function importarFatura(wid,file){const O=S.obras[S.sel];const w=O&&ctrlOf(O).semanas.find(x=>x.id===wid);if(!w||!file)return;
 let sample=null;try{sample=await window.claude?.use?.('sample')}catch{}
 if(!sample){setFst(wid,'A leitura de faturas ainda não está ativa. Preencha os valores à mão.',true);return}
 setFst(wid,`A ler ${file.name}…`);
 let doc,texto;try{({doc,texto}=await pdfLer(file))}catch(e){console.error(e);setFst(wid,`Não foi possível abrir ${file.name}.`,true);return}
 let imgs=[];
 if(texto.replace(/\s/g,'').length<80){const lim=await sample.limits().catch(()=>null);
  if(!lim?.images){setFst(wid,`${file.name} é uma digitalização sem texto e esta vista não permite enviar imagens ao Claude. Preencha à mão.`,true);return}
  try{imgs=await pdfImagens(doc,Math.min(3,lim.images.maxCount||3))}catch(e){setFst(wid,`Não foi possível ler as páginas de ${file.name}.`,true);return}}
 setFst(wid,`A extrair alojamento e viagens de ${file.name} com o Claude…`);
 const prompt=`Lês faturas de uma empresa portuguesa de montagens que envia equipas para obras. Desta fatura extrai APENAS os custos de ALOJAMENTO (hotel, apartamento, estadia, taxa turística) e de VIAGENS (avião, comboio, autocarro, táxi, transfer, portagens, estacionamento, combustível, aluguer de viatura). Ignora tudo o resto (refeições, material, serviços, cauções).
Responde só com JSON neste formato:
{"fornecedor":"","numero":"","data":"AAAA-MM-DD","moeda":"EUR","alojamento":[{"descricao":"","noites":0,"valor":0}],"viagens":[{"tipo":"aviao|comboio|autocarro|taxi|transfer|portagens|estacionamento|combustivel|aluguer_viatura|outro","descricao":"","valor":0}],"notas":""}
Regras:
- valor: o que foi pago, COM IVA, em número (ponto decimal). Se o IVA vier só no fim, reparte-o pelas linhas na proporção do valor.
- Uma linha por item da fatura; descricao curta (máximo 60 caracteres), com datas ou nomes se aparecerem.
- Se a moeda não for EUR, indica-a em "moeda" e deixa os valores na moeda original.
- Listas vazias se não houver alojamento ou viagens. notas: no máximo 120 caracteres, só se algo for ambíguo.
${imgs.length?'A fatura vem nas imagens anexas (páginas do PDF).':'Texto da fatura:\n'+texto.slice(0,60000)}`;
 let r;try{r=await sample.json(prompt,{modelTier:'default',...(imgs.length?{images:imgs}:{})})}catch(e){setFst(wid,sampleErr(e),true);return}
 if(!S.obras[O.id])return;
 const aloj=Math.round((r?.alojamento||[]).reduce((s,x)=>s+num(x.valor),0)*100)/100;
 const via=(r?.viagens||[]).filter(x=>num(x.valor));const viaT=Math.round(via.reduce((s,x)=>s+num(x.valor),0)*100)/100;
 const tag=`${r?.fornecedor||'Fatura'}${r?.numero?' nº '+r.numero:''}`;
 if(!aloj&&!via.length){setFst(wid,`${tag}: não encontrei alojamento nem viagens nesta fatura.`,true);return}
 const ref=(String(r?.fornecedor||'')+'|'+String(r?.numero||file.name)).toLowerCase();
 const ja=ctrlOf(O).semanas.findIndex(x=>(x.faturas||[]).some(f=>f.ref===ref));
 if(ja>=0){setFst(wid,`${tag} já tinha sido importada (semana de ${fmtD(ctrlOf(O).semanas[ja].inicio)}). Não a juntei outra vez.`,true);return}
 if(aloj)w.estadiaReal=Math.round((num(w.estadiaReal)+aloj)*100)/100;
 let vooTxt='';const tAv=(w.viagens||[]).find(t=>t.meio==='Avião'&&!isNum(t.valor)&&!isNum(t.bilhete));const av=via.filter(x=>x.tipo==='aviao');
 if(tAv&&av.length){const sv=Math.round(av.reduce((s,x)=>s+num(x.valor),0)*100)/100;tAv.valor=sv;tAv.fatura=ref;vooTxt=`avião ${eur2(sv)} (no valor da viagem de avião)`}
 const viaD=tAv&&av.length?via.filter(x=>x.tipo!=='aviao'):via;
 w.despesas=w.despesas||[];viaD.forEach(x=>w.despesas.push({cat:FAT_CAT[x.tipo]||'outros',descricao:`${tag}: ${x.descricao||x.tipo}`.slice(0,120),valor:Math.round(num(x.valor)*100)/100}));
 let assetId='';try{const as=await window.claude?.use?.('assets');if(as)assetId=(await as.upload(file,{type:'application/pdf'})).id}catch(e){console.error(e)}
 w.faturas=w.faturas||[];w.faturas.push({ref,assetId,ficheiro:file.name,fornecedor:String(r?.fornecedor||''),numero:String(r?.numero||''),data:String(r?.data||''),aloj,viagens:viaT,importada:today()});
 saveObra(O.id);
 const moeda=r?.moeda&&String(r.moeda).toUpperCase()!=='EUR'?` Atenção: valores em ${r.moeda}, converta para euros.`:'';
 const partes=[aloj?`alojamento ${eur2(aloj)} (somado à Estadia: valor da fatura)`:'',vooTxt,viaD.length?`${viaD.length} despesa(s) de viagem ${eur2(Math.round(viaD.reduce((s,x)=>s+num(x.valor),0)*100)/100)} (em Outras despesas)`:''].filter(Boolean);
 setFst(wid,`${tag}: ${partes.join(' · ')}. Confira os valores.${moeda}${r?.notas?' Nota: '+r.notas:''}`,!!moeda);
 render()}

/* o PDF original de uma fatura importada, guardado na plataforma */
async function dlFatura(wid,i){const O=S.obras[S.sel];const w=O&&ctrlOf(O).semanas.find(x=>x.id===wid);const f=w?.faturas?.[i];if(!f?.assetId)return;
 setFst(wid,`A preparar ${f.ficheiro}…`);
 try{const res=await fetch('/_blob/'+f.assetId);if(!res.ok)throw res.status;const blob=await res.blob();
  let dl=null;try{dl=await window.claude?.use?.('downloads')}catch{}
  if(dl){try{await dl.save({filename:f.ficheiro||'fatura.pdf',data:blob});setFst(wid,`${f.ficheiro} descarregado.`)}catch(e){setFst(wid,e?.code==='declined'?'':'Não foi possível descarregar o PDF.',e?.code!=='declined')}return}
  window.open(URL.createObjectURL(blob),'_blank');setFst(wid,'')}
 catch(e){console.error(e);setFst(wid,'O PDF desta fatura já não está disponível.',true)}}

async function dlFile(name,data,statusSel){let dl=null;try{dl=await window.claude?.use?.('downloads')}catch{}

 const ty=/\.csv$/.test(name)?'text/csv':/\.html$/.test(name)?'text/html':'application/json';const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:ty+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function iniTip(k){const D=S._ini;if(!D)return '';const [t,id]=k.split('|');
 if(t==='m'){const s=D.serie.find(x=>x.k===id);if(!s)return '';const ob=Object.entries(s.obras).sort((a,b)=>b[1]-a[1]);
  return `<b>${INI_MES[s.m-1]} ${s.y} · ${eur(s.tot)}</b>${RUB.filter(([r])=>s.rb[r]>0.5).map(([r,l])=>`<div class="r"><span><i style="background:var(--c-${r})"></i>${l}</span><span>${eur(s.rb[r])}</span></div>`).join('')}${ob.length?`<div style="margin-top:5px;opacity:.75">${ob.map(([oid,v])=>`${esc(S.obras[oid]?.nome||'')}: ${eur(v)}`).join('<br>')}</div>`:''}`}
 if(t==='d'){const x=D.obras.find(o=>o.O.id===id);if(!x)return '';return `<b>${esc(x.O.nome)}</b><div class="r"><span>Orçamento</span><span>${eur(x.C.orcTot)}</span></div><div class="r"><span>Real até agora</span><span>${eur(x.K.realTot)}</span></div><div class="r"><span>Previsão final</span><span>${eur(x.K.prevTot)}</span></div><div class="r"><span>Desvio</span><span>${sg(x.K.devTot)}</span></div>`}
 return ''}
(()=>{let tip=null;const show=(el,x,y)=>{const h=iniTip(el.dataset.tip);if(!h)return hide();if(!tip){tip=document.createElement('div');tip.className='vtip';tip.setAttribute('role','tooltip');document.body.appendChild(tip)}
  tip.innerHTML=h;tip.style.display='block';const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(8,L)+'px';tip.style.top=Math.max(8,T)+'px'};
 const hide=()=>{if(tip)tip.style.display='none'};
 document.addEventListener('mousemove',e=>{const el=e.target.closest?.('[data-tip]');if(el)show(el,e.clientX,e.clientY);else hide()});
 document.addEventListener('focusin',e=>{const el=e.target.closest?.('[data-tip]');if(el){const r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top)}else hide()});
 document.addEventListener('touchstart',e=>{const el=e.target.closest?.('[data-tip]');if(el){const t=e.touches[0];show(el,t.clientX,t.clientY-60)}else hide()},{passive:true});
 addEventListener('scroll',hide,{passive:true})})();
Object.assign(ACT,{iniAbrir:el=>{const id=el.dataset.id;if(!S.obras[id])return;S.view='obras';S.sel=id;S.tab=el.dataset.t||'controlo';S.filtro='';S.confirmDel=false;render();window.scrollTo(0,0)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const el=e.target;if(el?.tagName==='TR'&&el.dataset.a&&ACT[el.dataset.a]){e.preventDefault();ACT[el.dataset.a](el)}});

boot();
</script>
